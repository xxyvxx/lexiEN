<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Изучение слов — Лэкси EN</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/concept.css" />
  </head>
  <body class="concept">
    <a class="skip-link" href="#main">К содержимому</a>
    <header class="site-header">
      <nav class="nav" aria-label="Главная навигация">
        <a class="brand" href="../index.html">
          <span class="brand__mark"><img src="../assets/08_happy.svg" alt="" /></span>
          <span class="brand__text">Лэкси <span>EN</span></span>
        </a>
        <button class="nav__toggle" type="button" data-nav-toggle aria-expanded="false" aria-label="Меню">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav__links" data-nav-links>
          <li><a href="../index.html">Главная</a></li>
          <li><a href="../theory/index.html">Теория</a></li>
          <li><a class="is-active" href="index.html">Тренажёр</a></li>
          <li><a href="../profile/index.html">Профиль</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="page page--narrow">
      <div class="section-head">
        <div>
          <h1>Изучение слов</h1>
          <p class="lead">Выбери тему и учи слова карточками.</p>
        </div>
        <a class="btn btn--secondary" href="index.html?tab=practice">← К практике</a>
      </div>

      <section class="panel">
        <div class="vocab-level-grid" data-vocab-levels></div>
      </section>
    </main>

    <footer class="site-footer">Лэкси EN · изучение слов</footer>
    <script src="../js/storage.js?v=8"></script>
    <script src="../js/vocab-packs.js"></script>
    <script src="../js/main.js"></script>
    <script>
      const root = document.querySelector("[data-vocab-levels]");
      const levels = window.LexiVocabPacks?.levels || [];

      root.innerHTML = levels
        .map((level) => {
          const total = level.words.length;
          const { known, percent } = LexiStore.getVocabProgress(level.id, total);
          const left = Math.max(0, total - known);
          const meta =
            percent >= 100
              ? "Пройден · можно повторить"
              : left === total
                ? `${total} слов`
                : `${known} из ${total} · ${percent}%`;
          return `
            <a class="vocab-level-card" href="vocab-cards.html?level=${encodeURIComponent(level.id)}" style="--vocab-tone: ${level.tone}">
              <span class="vocab-level-card__title">${level.title}</span>
              <span class="vocab-level-card__desc">${level.short}</span>
              <span class="vocab-level-card__bar" aria-hidden="true"><span style="width: ${percent}%"></span></span>
              <span class="vocab-level-card__meta">${meta}</span>
            </a>
          `;
        })
        .join("");
    </script>
  </body>
</html>
