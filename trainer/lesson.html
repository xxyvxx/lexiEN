<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Урок — Лэкси EN</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/concept.css" />
  </head>
  <body class="concept">
    <div class="lesson-shell">
      <header class="lesson-top">
        <a class="lesson-close" data-lesson-close href="index.html" aria-label="Выйти из урока">×</a>
        <div class="lesson-progress" aria-label="Прогресс урока"><span data-lesson-progress style="width: 0%"></span></div>
        <div class="lesson-lives" data-lesson-lives aria-label="Опыт за урок">⚡ 0</div>
      </header>

      <main class="lesson-body" data-lesson-body></main>

      <footer class="lesson-footer">
        <div class="lesson-footer__inner">
          <div class="feedback" data-feedback hidden></div>
          <div class="lesson-footer__actions">
            <button class="lesson-hint-btn" type="button" data-hint hidden disabled>
              <span aria-hidden="true">💡</span>
              <span data-hint-label>Подсказка</span>
              <span class="lesson-hint-btn__n" data-hint-count>0</span>
            </button>
            <button class="btn btn--primary btn--wide" type="button" data-check disabled hidden>ПРОВЕРИТЬ</button>
          </div>
        </div>
      </footer>
    </div>
    <script src="../js/storage.js?v=8"></script>
    <script src="../js/lesson-viewport.js?v=1"></script>
    <script src="../js/speak.js"></script>
    <script src="../js/vocab.js?v=4"></script>
    <script src="../js/theory-data.js"></script>
    <script src="../js/characters.js"></script>
    <script src="../js/lesson-content.js?v=2"></script>
    <script src="../js/lesson-engine.js?v=12"></script>
  </body>
</html>
